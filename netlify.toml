[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/case-studies/tiger-fitness"
  to = "/case-studies/tiger-fitness/index.html"
  status = 200

[[redirects]]
  from = "/case-studies/tiger-fitness/"
  to = "/case-studies/tiger-fitness/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
