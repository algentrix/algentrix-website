[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/tradeconnect"
  to = "/case-studies/tradeconnect"
  status = 301

[[redirects]]
  from = "/tradeconnect/"
  to = "/case-studies/tradeconnect"
  status = 301

[[redirects]]
  from = "/case-studies/tiger-fitness"
  to = "/case-studies/tiger-fitness/index.html"
  status = 200

[[redirects]]
  from = "/case-studies/tiger-fitness/"
  to = "/case-studies/tiger-fitness/index.html"
  status = 200

[[redirects]]
  from = "/case-studies/workpulse"
  to = "/case-studies/workpulse/index.html"
  status = 200

[[redirects]]
  from = "/case-studies/workpulse/"
  to = "/case-studies/workpulse/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
